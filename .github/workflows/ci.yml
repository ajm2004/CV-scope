# Checks every pull request and every push to main. The job names (repo-guard,
# backend, frontend) are the required status checks of the main branch ruleset
# (.github/rulesets/protect-main.json); rename them there too.
#
# Security: pull requests from forks run with a read-only token and no secrets,
# and nothing here needs more. Never switch this to pull_request_target.
# Actions are pinned to full commit SHAs (Dependabot keeps them current).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: No secrets, binaries, stray media, hidden characters or foreign registries
        run: python .github/scripts/repo_guard.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System library for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      # The packages scripts/setup.sh installs on a machine without a GPU
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "backend[dev,onnx-cpu]"
      - name: Sample videos (CC-BY-4.0)
        run: python scripts/download_samples.py || echo "::warning::Sample videos could not be downloaded; the tests that need them are skipped."
      - name: Lint
        run: python -m ruff check backend/pathscope backend/tests
      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Exactly the locked versions, without running any package's install scripts.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
